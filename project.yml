name: WBLTracker
options:
  bundleIdPrefix: com.buildertest
  deploymentTarget:
    iOS: "17.2"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  WBLTracker:
    type: application
    platform: iOS
    sources: [WBLTracker]
    dependencies:
      - package: ZIPFoundation
    info:
      path: WBLTracker/Info.plist
      properties:
        CFBundleDisplayName: WBL Visits
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Your location is used only when planning workplace visits and calculating trip mileage."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildertest.wbltracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    schemes:
      WBLTracker:
        build:
          targets:
            WBLTracker: all
