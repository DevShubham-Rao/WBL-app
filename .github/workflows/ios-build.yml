name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: xcodebuild -project WBLTracker.xcodeproj -scheme WBLTracker -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/WBLTracker.app dist/Payload/
          (cd dist && zip -qr WBLTracker.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: WBLTracker-unsigned-ipa
          path: dist/WBLTracker.ipa
